# Turns on auto-merge for Dependabot patch and minor PRs; branch protection holds the merge until CI
# is green. garminconnect never auto-merges: Garmin breaks the unofficial client without notice. Nor does
# the Claude Agent SDK: it bundles Claude Code, whose plan-token auth a human re-checks on each bump.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'bhavinvirani/running-coach'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          !contains(steps.metadata.outputs.dependency-names, 'garminconnect') &&
          !contains(steps.metadata.outputs.dependency-names, '@anthropic-ai/claude-agent-sdk')
        # A GITHUB_TOKEN merge starts no workflow on main, so its commit gets no check run of its own; Render
        # (checksPass) deploys it once a later check run lands on main's head: the daily sync or the next merge.
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
