# Job ids are the required status checks on main (check, python, e2e, build); renaming one breaks
# branch protection. Render deploys a main commit only when every check on it passed or was skipped.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: running_coach
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d running_coach"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the test and e2e databases
        run: docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d running_coach < docker/postgres-init.sql
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          cache-dependency-glob: services/garmin/uv.lock
      # Integration tests spawn the real Garmin service in fixture mode from its venv.
      - name: Garmin service venv
        run: uv sync --locked --no-dev
        working-directory: services/garmin
      - run: pnpm install --frozen-lockfile
      # CI uses the same local values a developer starts from.
      - run: cp .env.example .env
      - run: pnpm check

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Filter steps, not the job: a job that always finishes green satisfies the required check.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            garmin:
              - services/garmin/**
              - packages/shared/src/json-schema/**
              - package.json
              - .github/workflows/ci.yml
      - if: steps.changes.outputs.garmin == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.changes.outputs.garmin == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - if: steps.changes.outputs.garmin == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          cache-dependency-glob: services/garmin/uv.lock
      - if: steps.changes.outputs.garmin == 'true'
        run: pnpm py:check
        env:
          UV_LOCKED: "1" # fail instead of rewriting uv.lock when it no longer matches pyproject.toml

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: running_coach
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d running_coach"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the test and e2e databases
        run: docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d running_coach < docker/postgres-init.sql
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          cache-dependency-glob: services/garmin/uv.lock
      - name: Garmin service venv
        run: uv sync --locked --no-dev
        working-directory: services/garmin
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Install Chromium for Playwright
        run: pnpm --filter @running-coach/web exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      # Screenshots run the browser inside the official Playwright image, so baselines match local runs.
      - run: pnpm test:screens
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: running_coach
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d running_coach"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm build runs inside the image (and on the host in e2e), so no host toolchain here.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: running-coach:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Boot the image the way Render runs it (env from render.yaml, PORT 10000, the free plan's 512 MB and no swap,
      # no fixtures, a fresh database) and wait for /health, which is 200 only once migrations ran and
      # the Garmin service is up. Then check what slice 1 relies on: cache headers, sign-in, non-root,
      # the uvicorn child and memory well under 400 MB.
      - name: Smoke test the image
        shell: bash
        run: |
          set -euo pipefail
          base=http://localhost:10000
          cookies="$RUNNER_TEMP/cookies.txt"
          owner_password="$(openssl rand -hex 16)"
          docker run -d --name app --network host --memory 512m --memory-swap 512m \
            -e PORT=10000 \
            -e NODE_ENV=production \
            -e GARMIN_FIXTURES=0 \
            -e LOG_LEVEL=info \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5434/running_coach \
            -e MASTER_KEY="$(openssl rand -base64 32)" \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" \
            -e APP_URL="$base" \
            -e CRON_SECRET="$(openssl rand -hex 32)" \
            -e OWNER_EMAIL=owner@example.com \
            -e OWNER_PASSWORD="$owner_password" \
            -e OWNER_NAME=Owner \
            running-coach:ci
          for _ in $(seq 1 60); do
            curl -fs -o /dev/null "$base/health" && break
            sleep 1
          done
          curl -fsS "$base/health"
          echo

          # The API serves the SPA: the shell and service worker revalidate, hashed assets are immutable.
          cache_control() { curl -fsS -o /dev/null -D - "$base$1" | tr -d '\r' | grep -i '^cache-control:' | cut -d ' ' -f 2-; }
          asset="$(curl -fsS "$base/" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js')"
          test "$(cache_control /)" = "no-cache"
          test "$(cache_control "$asset")" = "public, max-age=31536000, immutable"
          test "$(cache_control /sw.js)" = "no-cache"
          curl -fsS -o /dev/null "$base/manifest.webmanifest"

          # The owner seeded at boot signs in through Better Auth (Origin must equal APP_URL).
          curl -fsS -o /dev/null -c "$cookies" -H "Origin: $base" -H "Content-Type: application/json" \
            -d "{\"email\":\"owner@example.com\",\"password\":\"$owner_password\"}" \
            "$base/api/auth/sign-in/email"
          me="$(curl -fsS -b "$cookies" "$base/api/me")"
          grep -q '"email":"owner@example.com"' <<<"$me"

          # Both processes run as the image's node user; the Garmin service is the API's child.
          test "$(docker exec app id -u)" = "1000"
          processes="$(docker top app -o pid,uid,rss,args)"
          echo "$processes"
          grep -q 'uvicorn garmin_service.main:app' <<<"$processes"
          awk 'NR > 1 && $2 == 0 { root = 1 } END { exit root }' <<<"$processes"

          for _ in $(seq 1 20); do curl -fsS -o /dev/null -b "$cookies" "$base/api/me"; done
          memory="$(docker stats --no-stream --format '{{.MemUsage}}' app)"
          echo "memory after 20 requests: $memory"
          awk -v used="${memory%% /*}" 'BEGIN {
            mib = used + 0
            if (used ~ /GiB$/) mib *= 1024
            else if (used ~ /KiB$/) mib /= 1024
            else if (used !~ /MiB$/) exit 1
            exit !(mib < 400)
          }'
      - name: Image logs
        if: always()
        run: docker logs app || true

  # Not a required check, and PR-only: on main it would hold every deploy hostage to a new advisory.
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm audit --audit-level high
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          cache-dependency-glob: services/garmin/uv.lock
      - name: pip-audit the Garmin service
        working-directory: services/garmin
        run: |
          uv export --frozen --format requirements.txt --no-emit-project --output-file "$RUNNER_TEMP/garmin-requirements.txt"
          uvx pip-audit@2.10.1 --strict --disable-pip --requirement "$RUNNER_TEMP/garmin-requirements.txt"
