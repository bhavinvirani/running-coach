[project]
name = "garmin-service"
version = "0.1.0"
description = "Stateless FastAPI wrapper around garminconnect, spawned by the API on 127.0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinned exactly and excluded from Dependabot auto-merge: Garmin breaks the client without notice.
    "garminconnect==0.3.17",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "types-jsonschema==4.26.0.20260518",
]

[tool.uv]
# Not an installable package: uvicorn and pytest run from this folder and import garmin_service from it.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "S",   # bandit
    "C4",  # comprehensions
    "SIM", # simplify
    "PT",  # pytest style
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests assert and use fixed fake secrets on purpose.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["garmin_service", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# garminconnect is annotated but ships no py.typed marker.
module = ["garminconnect", "garminconnect.*"]
follow_untyped_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
# Request models accept camelCase only (like zod); Python never constructs them, so mypy needs no
# field-name __init__ for them.
warn_required_dynamic_aliases = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = [
    "error",
    # Starlette 1.7's TestClient prefers httpx2; httpx 0.28 still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
