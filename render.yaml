# Render Blueprint: one free Docker web service holding the SPA, API, worker and Garmin service.
# Deploys main only after every CI check on the commit passes; migrations run at process start.
services:
  - type: web
    name: running-coach
    runtime: docker
    plan: free
    region: ohio
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    previews:
      generation: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: GARMIN_FIXTURES
        value: "0"
      - key: LOG_LEVEL
        value: info
      # Secrets and per-deploy values: Render asks for each once, when the Blueprint is created.
      # Names and formats are in .env.example. DATABASE_URL is Neon's direct (non-pooler) string.
      - key: DATABASE_URL
        sync: false
      - key: MASTER_KEY
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_NAME
        sync: false
      # Also passed to the Docker build as a build arg, where Vite inlines it.
      - key: VITE_MAPBOX_TOKEN
        sync: false
